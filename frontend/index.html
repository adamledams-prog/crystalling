<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a5f4a" />
    <meta name="description" content="Guerre — installe l'application et joue en duel." />
    <title>Guerre</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body class="mode-onboarding boot-loading">
    <div
      id="sync-screen"
      class="sync-screen"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-labelledby="sync-pct"
      aria-busy="true"
    >
      <div class="sync-bar-dock">
        <p id="sync-pct" class="sync-pct">0%</p>
        <div class="sync-bar-track">
          <div id="sync-bar-fill" class="sync-bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="screen-onboarding" class="screen-onboarding">
      <main class="felt" aria-live="polite">
        <h1 class="logo">Guerre</h1>

        <section class="robot-zone" id="robot-zone">
          <div class="bubble">
            <p id="robot-message">Salut ! Installe l'application pour jouer à Guerre.</p>
          </div>
          <img
            class="robot"
            src="images/images__18_-removebg-preview (1).png"
            alt=""
            width="240"
            height="240"
          />

          <div class="install-block" id="install-block">
            <button type="button" class="btn-install hidden" id="btn-install">
              Installer l'application
            </button>
            <p class="install-hint hidden" id="install-hint"></p>
          </div>

          <form class="tuto-form hidden" id="tuto-pseudo" autocomplete="off">
            <label class="sr-only" for="pseudo-input">Ton pseudo</label>
            <input
              type="text"
              id="pseudo-input"
              name="pseudo"
              maxlength="20"
              placeholder="Ton pseudo…"
              autocomplete="nickname"
              enterkeyhint="done"
            />
            <button type="submit" class="btn-install">Valider</button>
          </form>
        </section>
      </main>
    </div>

    <div id="screen-home" class="screen-home hidden" hidden aria-label="Menu principal">
      <div class="hub-felt">
        <p class="hub-title" id="hub-title">Guerre</p>

        <div class="hub-arena" id="hub-arena" aria-live="polite">
          <div class="hub-battlefield" id="hub-battlefield">
            <section class="hub-column hub-column--attaquant" aria-label="Colonne attaquants">
              <h3 class="hub-column-label">Attaquant</h3>
              <ul class="hub-slots hub-slots--6">
                <li class="hub-slot" data-col="attaquant" data-slot="0"></li>
                <li class="hub-slot" data-col="attaquant" data-slot="1"></li>
                <li class="hub-slot" data-col="attaquant" data-slot="2"></li>
                <li class="hub-slot" data-col="attaquant" data-slot="3"></li>
                <li class="hub-slot" data-col="attaquant" data-slot="4"></li>
                <li class="hub-slot" data-col="attaquant" data-slot="5"></li>
              </ul>
            </section>
            <section class="hub-column hub-column--defenseur" aria-label="Colonne défenseurs">
              <h3 class="hub-column-label">Défenseur</h3>
              <ul class="hub-slots">
                <li class="hub-slot" data-col="defenseur" data-slot="0"></li>
                <li class="hub-slot" data-col="defenseur" data-slot="1"></li>
                <li class="hub-slot" data-col="defenseur" data-slot="2"></li>
              </ul>
            </section>
          </div>
          <div class="hub-arena-stage lorus-mega-stage" id="hub-arena-stage" hidden aria-hidden="true">
            <canvas class="lorus-mega-canvas" aria-hidden="true"></canvas>
            <div class="lorus-mega-sunburst" aria-hidden="true"></div>
            <div class="lorus-mega-flash" aria-hidden="true"></div>
            <p class="lorus-mega-badge" id="lorus-mega-badge" hidden>BRAWLER !</p>
            <img
              class="lorus-mega-drone"
              id="lorus-mega-drone"
              src="./images/persos/solaris-drone.png"
              alt=""
              width="56"
              height="56"
              hidden
            />
            <video
              class="lorus-mega-video"
              id="lorus-mega-video"
              muted
              playsinline
              preload="auto"
              hidden
              aria-hidden="true"
            ></video>
            <div class="lorus-mega-hero">
              <div class="lorus-mega-rings" aria-hidden="true">
                <span></span><span></span><span></span>
              </div>
              <div class="lorus-mega-spr" id="lorus-mega-spr" hidden></div>
              <img class="lorus-mega-img" alt="" width="280" height="280" />
              <p class="lorus-mega-name"></p>
            </div>
          </div>
        </div>

        <div
          id="update-banner"
          class="update-banner hidden"
          role="status"
          aria-live="polite"
          hidden
        >
          <p id="update-banner-text" class="update-banner-text">
            Nouvelle version disponible — récupère les derniers changements.
          </p>
          <button type="button" class="update-banner-btn" id="btn-apply-update">
            Mettre à jour
          </button>
        </div>

        <button
          type="button"
          class="hub-update"
          id="btn-check-update"
          aria-label="Vérifier les mises à jour"
          title="Mettre à jour l'app"
        >
          ↻
        </button>

        <button type="button" class="hub-profile" id="hub-profile">
          <span class="hub-avatar" id="hub-avatar" aria-hidden="true">?</span>
          <span class="hub-name" id="hub-name">Joueur</span>
        </button>

        <button type="button" class="hub-pill hub-amis" id="btn-amis">Amis</button>

        <button type="button" class="hub-side hub-magasin" id="btn-magasin">Magasin</button>

        <div class="hub-bottom" role="group" aria-label="Actions principales">
          <button type="button" class="hub-play hub-jouer" id="btn-jouer">Jouer</button>
          <button type="button" class="hub-lorus" id="btn-lorus">Lorus</button>
        </div>
      </div>
    </div>

    <article
      class="lorus-panel hidden"
      id="lorus-panel"
      role="dialog"
      aria-labelledby="lorus-title"
      aria-modal="true"
      hidden
    >
      <div class="lorus-backdrop" id="lorus-backdrop" tabindex="-1" aria-hidden="true"></div>
      <div class="lorus-sheet">
        <header class="lorus-head">
          <h2 id="lorus-title">Lorus</h2>
          <p class="lorus-sub">Tous tes personnages</p>
          <button type="button" class="lorus-close" id="lorus-close" aria-label="Fermer">×</button>
        </header>
        <div class="lorus-filters" role="toolbar" aria-label="Filtrer par classe">
          <button
            type="button"
            class="lorus-filter lorus-filter--active"
            id="lorus-filter-all"
            data-lorus-filter="all"
            aria-pressed="true"
          >
            Tous les Lorus
          </button>
          <button
            type="button"
            class="lorus-filter"
            id="lorus-filter-defenseur"
            data-lorus-filter="defenseur"
            aria-pressed="false"
          >
            Défenseur
          </button>
          <button
            type="button"
            class="lorus-filter"
            id="lorus-filter-attaque"
            data-lorus-filter="attaquant"
            aria-pressed="false"
          >
            Attaquant
          </button>
        </div>
        <ul class="lorus-grid" id="lorus-grid" aria-live="polite">
          <li class="lorus-empty" id="lorus-empty">Aucun perso pour l’instant — ajoute-les ici bientôt.</li>
        </ul>
      </div>
    </article>

    <script src="/src/main.js" type="module"></script>
  </body>
</html>
